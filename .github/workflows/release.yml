name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.10.0

      - name: Add dependency chart repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Warn about changed charts without a new version
        run: |
          for chart_yaml in charts/*/Chart.yaml; do
            chart_dir=$(dirname "$chart_yaml")
            name=$(sed -n 's/^name: *//p' "$chart_yaml")
            version=$(sed -n 's/^version: *//p' "$chart_yaml")
            tag="$name-$version"

            # No release for this version yet: chart-releaser publishes it, nothing to warn about.
            if ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
              continue
            fi

            # This version is already released, but the chart files differ from it: the version bump is missing.
            if ! git diff --quiet "$tag" HEAD -- "$chart_dir"; then
              echo "::warning file=$chart_yaml::$name has changed since release $tag, but its version was not raised. The change is only published after the version in Chart.yaml is increased."
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          # A chart that changed without a version bump already has its release; skip it instead of
          # failing the whole run (and with it the release of the other charts).
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"