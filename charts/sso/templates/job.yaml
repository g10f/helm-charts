{{- range .Values.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    {{- include "sso.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "sso.labelsJob" $ | nindent 12 }}
        spec:
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: {{ $.Chart.Name }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command:
                {{- .command | toYaml | nindent 16 }}
              envFrom:
                {{- with $.Values.extraEnvFrom }}
                {{- tpl . $ | nindent 16 }}
                {{- end }}
              {{- if .extraEnv }}
              env:
                {{- with .extraEnv }}
                {{- tpl . $ | nindent 16 }}
                {{- end }}
              {{- end }}
              {{- with (.resources | default $.Values.jobResources) }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - mountPath: /opt/g10f/sso/htdocs/media
                  name: media
          restartPolicy: Never
          volumes:
            - name: media
              persistentVolumeClaim:
                claimName: {{ include "sso.fullname" $ }}-media
{{- end }}
